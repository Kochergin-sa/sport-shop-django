<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}СпортПит{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        
        header {
            background: #1a1a2e;
            color: white;
            padding: 15px 0;
        }
        nav {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .logo { font-size: 22px; font-weight: bold; color: #00d9ff; }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            padding: 8px 16px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .nav-links a:hover { background: #00d9ff; color: #1a1a2e; }
        
        main {
            flex: 1;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }
        
        footer {
            background: #1a1a2e;
            color: #aaa;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }
        
        h1 { margin-bottom: 20px; color: #1a1a2e; }
        p { line-height: 1.6; margin-bottom: 15px; }
        
        .product-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">СпортПит</div>
            <div class="nav-links">
                <a href="{% url 'home' %}">Главная</a>
                <a href="{% url 'catalog' %}">Каталог</a>
                <a href="{% url 'about' %}">О нас</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>© 2026 Интернет-магазин спортивного питания «СпортПит». Все права защищены.</p>
    </footer>
</body>
</html>
